permissions:
  contents: read

concurrency:
  group: docs-template-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm --filter @doxahq/docs-template lint

      - name: Run typecheck
        run: pnpm --filter @doxahq/docs-template typecheck

      - name: Run tests
        run: pnpm --filter @doxahq/docs-template test

      - name: Build workspace dependencies
        run: pnpm --filter @doxahq/docs-template^... build

      - name: Build Cloudflare output
        run: pnpm --filter @doxahq/docs-template build:cloudflare
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_COMPANY_LINK: ${{ vars.VITE_COMPANY_LINK }}
          VITE_OPENSOURCE_REPO_URL: ${{ vars.VITE_OPENSOURCE_REPO_URL }}
