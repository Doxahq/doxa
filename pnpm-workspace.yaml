packages:
  - "packages/*"
  - "apps/*"
  - "apps/utility-jobs/*"

onlyBuiltDependencies:
  - "@openrouter/sdk"
  - esbuild
  - sharp
  - workerd

# core-js-pure's postinstall only prints a funding message.
ignoredBuiltDependencies:
  - core-js-pure

# One version for packages that share schemas across Workers. Two versions
# in one bundle double the Zod code and its start-up work.
catalog:
  zod: ^4.6.5

# One TanStack Start and Router for the whole workspace, including the
# optional peers of @tanstack/react-form and better-auth-cloudflare. 1.168.61
# is the first line with the server-function XSS fix (GHSA for
# start-server-core < 1.169.39) that still supports Vite 7.
overrides:
  "@tanstack/react-start": "1.168.61"
  "@tanstack/react-router": "1.170.42"
  # One copy of the Radix layer stack for every overlay (dialog, menu, popover,
  # select, tooltip). With separate copies, a dialog does not see a popover or a
  # menu opened inside it as a layer above it, and its "no clicks outside" rule
  # blocks clicks in that popover (the branch picker in the repository dialog).
  "@radix-ui/react-dismissable-layer": "1.1.20"
  "@radix-ui/react-focus-scope": "1.2.0"
  "@radix-ui/react-focus-guards": "1.1.6"
